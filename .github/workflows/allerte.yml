name: Aggiorna allerte DPC

on:
  schedule:
    # Il DPC pubblica di solito tra le 15 e le 16 (ora italiana); GitHub ritarda o salta
    # spesso le esecuzioni programmate, quindi controlliamo ogni 15 minuti in quella fascia.
    - cron: "7,22,37,52 12-16 * * *"
    - cron: "17 18,21,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica l'ultimo bollettino di criticità
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/aggiorna_allerte.py
      - name: Salva se cambiato
        run: |
          git config user.name "safe-and-sound-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rischio/allerte.json
          git diff --cached --quiet || (git commit -m "Allerte: aggiornamento bollettino DPC" && git push)
