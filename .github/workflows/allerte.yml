name: Aggiorna allerte DPC

on:
  schedule:
    - cron: "20 13,14,15,16,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica l'ultimo bollettino di criticità
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/aggiorna_allerte.py
      - name: Salva se cambiato
        run: |
          git config user.name "safe-and-sound-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rischio/allerte.json
          git diff --cached --quiet || (git commit -m "Allerte: aggiornamento bollettino DPC" && git push)
