name: Settimana sismica (Reel del lunedì)

on:
  schedule:
    - cron: "10 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Strumenti (ffmpeg, font, Playwright)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fontconfig >/dev/null
          bash strumenti/prepara_ambiente.sh || true
          npm i --no-save playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Dati INGV della settimana precedente
        run: python3 scripts/settimana_sismica.py
      - name: Render del Reel
        run: |
          D=sismica/$(date +%F)
          cd strumenti/sismica
          cat > cap-ci.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{const [f,dur,out]=process.argv.slice(2);const b=await chromium.launch();const p=await b.newPage({viewport:{width:1080,height:1920}});
          await p.goto('file://'+process.cwd()+'/'+f);await p.waitForTimeout(800);const n=Math.round(dur*30);require('fs').mkdirSync(out,{recursive:true});
          for(let i=0;i<n;i++){await p.evaluate(t=>draw(t),i/30);await p.screenshot({path:`${out}/${String(i).padStart(4,'0')}.jpg`,type:'jpeg',quality:92});}
          await b.close();})();
          JS
          NODE_PATH=$GITHUB_WORKSPACE/node_modules node cap-ci.js settimana-sismica.html 16.5 frames
          ffmpeg -loglevel error -y -framerate 30 -i frames/%04d.jpg -c:v libx264 -pix_fmt yuv420p -crf 19 -movflags +faststart ../../$D/settimana-sismica.mp4
          cp frames/0054.jpg ../../$D/settimana-sismica-copertina.jpg
          rm -rf frames cap-ci.js
      - name: Salva
        run: |
          git config user.name "safe-and-sound-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sismica strumenti/sismica/dati.js
          git diff --cached --quiet || (git commit -m "Settimana sismica: Reel $(date +%F)" && git push)
